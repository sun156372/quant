# config.yaml -- Binance market data configuration
# All symbols are now in Binance USDT futures-style spot pairs.

exchange: binance
symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT]

# --- data
interval: "1h"
history_bars: 400

# --- sizing (20% per trade, 30% hard ceiling)
position_size_pct: 0.20
max_position_size_pct: 0.30
max_concurrent_trades: 2
reserve_cash_pct: 0.10

# --- signal (frozen M1)
entry_prob: 0.50
hold_bars: 4
stop_loss_pct: null
take_profit_pct: null

# --- costs / execution
# Keep the same strategy parameters; only exchange identity changes.
taker_fee: 0.00045
maker_fee: 0.00015
slippage_pct: 0.0002
retry_attempts: 3
retry_backoff_sec: 2.0

# --- runtime
dry_run: true
state_file: "state.json"
model_file: "model/mvp_logit.pkl"
log_file: "run_live.log"
poll_seconds: 60
